# Horizon: один VPS, Docker Compose. Секреты — в .env (см. .env.example).
name: horizon

# Один образ на migrate и api. Собирает его migrate, остальные берут готовый.
x-server: &server
  image: horizon/server:local
  pull_policy: never
  restart: unless-stopped
  # Пароля postgres здесь нет: DATABASE_ADMIN_URL нужен только migrate и cli,
  # а api смотрит наружу — суперпользователь базы в его окружении не лежит.
  environment: &server-env
    NODE_ENV: production
    TZ: ${TZ_NAME:-Europe/Kyiv}
    DATABASE_URL: postgres://horizon_api:${HORIZON_API_DB_PASSWORD:?}@db:5432/horizon
    SECURE_COOKIES: ${SECURE_COOKIES:-true}
    SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
    INVITE_VALID_HOURS: ${INVITE_VALID_HOURS:-72}
    APP_SECRET: ${APP_SECRET:?}
    TZ_NAME: ${TZ_NAME:-Europe/Kyiv}
    DEFAULT_LOCALE: ${DEFAULT_LOCALE:-uk}
    # Пропуск к подробностям /api/health: версия схемы и счётчики. Пусто — наружу
    # уходит только «жив» и degraded.
    OPS_TOKEN: ${OPS_TOKEN:-}
    # Сколько прокси перед API. Профиль tls — это Caddy + nginx, два прыжка:
    # с единицей адресом клиента станет контейнерный адрес Caddy, и лимит
    # неудачных входов станет общим на всю роту.
    TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    # По нему API сверяет число прыжков: с tls меньше двух — не стартует.
    COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    SESSION_ROTATE_HOURS: ${SESSION_ROTATE_HOURS:-24}
    LOGIN_FAILS_PER_IP_HOUR: ${LOGIN_FAILS_PER_IP_HOUR:-20}
    LOGIN_FAILS_PER_USER_HOUR: ${LOGIN_FAILS_PER_USER_HOUR:-50}
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: horizon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: ${TZ_NAME:-Europe/Kyiv}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d horizon']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *server
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    pull_policy: build
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    environment:
      <<: *server-env
      # Владелец схемы: только здесь и в cli.
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@db:5432/horizon
      HORIZON_API_DB_PASSWORD: ${HORIZON_API_DB_PASSWORD:?}
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *server
    command: ['node', 'dist/api.js']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: horizon/web:local
    restart: unless-stopped
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    depends_on:
      api: { condition: service_healthy }

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: horizon
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: ${TZ_NAME:-Europe/Kyiv}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    depends_on:
      migrate: { condition: service_completed_successfully }

  # HTTPS для боя: docker compose --profile tls up -d  (нужен DOMAIN и открытые 80/443)
  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  dbdata:
  caddy_data:

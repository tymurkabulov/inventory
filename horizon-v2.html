<!DOCTYPE html>
<html lang="uk" data-theme="dark" data-size="phone">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon — прототип</title>
<style>
:root {
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Consolas, Menlo, monospace;
  --fs-12: 12px; --fs-14: 14px; --fs-16: 16px; --fs-18: 18px; --fs-24: 24px;
  --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --radius: 4px; --radius-lg: 6px; --touch: 44px; --sidebar: 212px;
}
html[data-theme="dark"] {
  --bg: #0f1214;
  --bg-0: #0c0e10;
  --surf: #15191c;
  --surf-2: #1b2024;
  --surf-3: #22282d;
  --line: #262c31;
  --line-2: #343b41;
  --text: #e3e6e8;
  --muted: #929ba1;
  --faint: #6e777d;
  --accent: #3b6e8f;
  --accent-hover: #4a82a6;
  --accent-ink: #f3f7fa;
  --accent-dim: #1c3344;
  --focus: #7eafcd;
  --red: #c7453a;
  --red-hover: #d85a4e;
  --red-dim: #3a1c1a;
  --red-ink: #f8d4d0;
  --yellow: #cf9f1f;
  --yellow-dim: #3a3010;
  --yellow-ink: #f6e6b0;
  --green: #2f8a5b;
  --green-hover: #37a06a;
  --green-dim: #163226;
  --green-ink: #cdebd9;
  --full: #4aa888;
  --full-dim: #16302a;
  --full-ink: #cfe8de;
  --shadow: 0 8px 24px rgba(0,0,0,.48);
  --scrim: rgba(8,10,12,.64);
}
html[data-theme="light"] {
  --bg: #e8ecef;
  --bg-0: #dce2e6;
  --surf: #f6f8f9;
  --surf-2: #ffffff;
  --surf-3: #eef2f4;
  --line: #c5ced3;
  --line-2: #9aa6ad;
  --text: #161a1d;
  --muted: #5b656b;
  --faint: #6f7a81;
  --accent: #2a5570;
  --accent-hover: #1f4258;
  --accent-ink: #f3f7fa;
  --accent-dim: #d4e3ed;
  --focus: #2a5570;
  --red: #a8332a;
  --red-hover: #8f281f;
  --red-dim: #f3d6d3;
  --red-ink: #4a1410;
  --yellow: #8a6a0c;
  --yellow-dim: #f3e6b8;
  --yellow-ink: #3d2e00;
  --green: #1f6b44;
  --green-hover: #175334;
  --green-dim: #cfe6d8;
  --green-ink: #0d2e1c;
  --full: #1d6b56;
  --full-dim: #cfe6de;
  --full-ink: #0d2e26;
  --shadow: 0 8px 24px rgba(20,24,28,.16);
  --scrim: rgba(20,24,28,.48);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); background: #0a0c0e; color: #d7dce0; min-height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
.studio { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
.studio-bar, .studio-nav { background: #101214; border-bottom: 1px solid #262c31; }
.studio-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; }
.studio-bar .brand { font-size: 12px; letter-spacing: .08em; font-weight: 700; color: #929ba1; }
.studio-bar .sp { flex: 1; }
.seg { display: flex; border: 1px solid #262c31; }
.seg button { background: #15191c; border: 0; color: #c5ccd0; padding: 6px 10px; min-height: 36px; font-size: 12px; }
.seg button[aria-pressed="true"] { background: #3b6e8f; color: #f3f7fa; font-weight: 600; }
.studio-nav { display: flex; gap: 4px; overflow-x: auto; padding: 6px 12px; }
.studio-nav button { border: 1px solid #262c31; background: #15191c; color: #c5ccd0; padding: 6px 8px; font-size: 12px; white-space: nowrap; }
.studio-nav button[aria-current="page"] { background: #1b2024; border-color: #3b6e8f; color: #e3e6e8; }
.stage-wrap { overflow: auto; padding: 16px; background: #0a0c0e; }
.stage { display: flex; justify-content: center; }
.device { background: var(--bg); color: var(--text); border: 1px solid #262c31; overflow: hidden; position: relative; }
html[data-size="phone"] .device { width: 390px; height: 844px; }
html[data-size="laptop"] .device { width: 1366px; height: 820px; max-width: calc(100vw - 32px); }
.app { height: 100%; display: flex; flex-direction: column; }
html[data-size="laptop"] .app { flex-direction: row; }
.side { display: none; width: var(--sidebar); flex-shrink: 0; background: var(--bg-0); border-right: 1px solid var(--line); padding: 12px; flex-direction: column; gap: 2px; }
html[data-size="laptop"] .side { display: flex; }
.side .logo { font-size: 12px; letter-spacing: .12em; font-weight: 700; color: var(--muted); padding: 8px 8px 16px; }
.nav-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 0; color: var(--text); padding: 10px 8px; min-height: 44px; text-align: left; border-radius: 4px; }
.nav-btn[aria-current="page"] { background: var(--surf-2); }
.side .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px; }
.main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surf); }
.top h1 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 650; }
.top .meta { font-size: 12px; line-height: 16px; color: var(--muted); }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.pad { padding: 12px; }
.bottom { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--surf); }
html[data-size="laptop"] .phone-only { display: none !important; }
html[data-size="phone"] .desk-only { display: none !important; }
.btn { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); background: var(--surf-2); color: var(--text); border-radius: 4px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--surf-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .42; transform: none; }
.btn-blue { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-blue:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-green { background: var(--green); border-color: var(--green); color: #fff; }
.btn-green:hover { background: var(--green-hover); }
.btn-red { background: var(--red-dim); border-color: var(--red); color: var(--red-ink); }
.btn-red:hover { background: var(--red); color: #fff; }
.btn-gray { background: transparent; color: var(--muted); }
.btn-block { width: 100%; }
.btn-sm { min-height: 36px; padding: 0 10px; font-size: 12px; }
.icon-btn { width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--line); background: var(--surf-2); color: var(--text); border-radius: 4px; display: grid; place-items: center; }
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.field { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); background: var(--bg-0); color: var(--text); border-radius: 4px; }
.field::placeholder { color: var(--faint); }
textarea.field { padding: 10px 12px; min-height: 80px; resize: vertical; }
.otp { display: flex; gap: 6px; }
.otp input { width: 44px; height: 48px; text-align: center; font-size: 20px; font-weight: 700; border: 1px solid var(--line); background: var(--bg-0); border-radius: 4px; font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.hint { font-size: 12px; line-height: 16px; color: var(--muted); margin: 0; }
.link { background: none; border: 0; color: var(--accent); padding: 8px 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border: 1px solid var(--line); background: var(--surf-2); color: var(--text); border-radius: 4px; white-space: nowrap; }
.badge .mark { width: 8px; height: 8px; flex-shrink: 0; background: currentColor; }
.lvl-crit { color: var(--red-ink); background: var(--red-dim); border-color: var(--red); }
.lvl-crit .mark { clip-path: polygon(50% 0, 100% 100%, 0 100%); background: var(--red); }
.lvl-low { color: var(--yellow-ink); background: var(--yellow-dim); border-color: var(--yellow); }
.lvl-low .mark { transform: rotate(45deg); background: var(--yellow); }
.lvl-ok { color: var(--green-ink); background: var(--green-dim); border-color: var(--green); }
.lvl-ok .mark { border-radius: 50%; background: var(--green); }
.lvl-full { color: var(--full-ink); background: var(--full-dim); border-color: var(--full); }
.lvl-full .mark { width: 10px; height: 4px; background: var(--full); }
.cond { font-size: 12px; font-weight: 600; color: var(--muted); }
.cond i { display: inline-block; width: 7px; height: 7px; margin-right: 6px; background: currentColor; }
.cond-ok i { border-radius: 50%; color: var(--green); }
.cond-rep i { clip-path: polygon(50% 0, 100% 100%, 0 100%); color: var(--yellow); }
.cond-bad i { color: var(--red); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--surf-2); color: var(--text); border-radius: 4px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--surf-3); border-color: var(--text); }
.chip .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
html[data-size="phone"] .chips { flex-wrap: nowrap; overflow-x: auto; }
.banner { margin: 12px; padding: 10px 12px; font-size: 12px; font-weight: 600; border: 1px dashed var(--yellow); background: var(--yellow-dim); color: var(--yellow-ink); }
.sticky-tools { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 10px 12px; border-bottom: 1px solid var(--line); }
.item { position: relative; background: var(--surf); border: 1px solid var(--line); border-radius: 4px; padding: 10px 10px 10px 14px; display: grid; gap: 8px; }
.item.crit { background: var(--red-dim); border-color: var(--red); }
.rail { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.item-hd { display: flex; align-items: flex-start; gap: 8px; }
.item-hd h3 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 700; flex: 1; }
.sub { font-size: 12px; color: var(--muted); }
.qty { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; }
.stepper button { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--surf-2); color: var(--text); font-size: 20px; }
.stepper input { width: 56px; height: 44px; border: 1px solid var(--line); border-left: 0; border-right: 0; background: var(--bg-0); text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.target { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
html[data-size="laptop"] .as-cards { display: none; }
html[data-size="phone"] .as-table { display: none; }
.table-wrap { overflow: auto; height: 100%; }
table.data { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
table.data th { position: sticky; top: 0; z-index: 2; background: var(--surf-2); text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 8px; border-bottom: 1px solid var(--line); }
table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr.crit td { background: var(--red-dim); }
table.data tr.low td { background: color-mix(in srgb, var(--yellow-dim) 55%, transparent); }
table.data .name { font-weight: 700; }
.tiles { display: grid; gap: 8px; }
html[data-size="laptop"] .tiles { grid-template-columns: repeat(3, 1fr); }
.tile { background: var(--surf); border: 1px solid var(--line); border-radius: 4px; padding: 12px; text-align: left; color: inherit; min-height: 118px; display: flex; flex-direction: column; gap: 8px; }
.tile.stale { border-style: dashed; border-color: var(--yellow); }
.tile h3 { margin: 0; font-size: 16px; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.feed { display: flex; flex-direction: column; gap: 6px; }
.feed-item { display: flex; gap: 10px; align-items: flex-start; background: var(--surf); border: 1px solid var(--line); padding: 10px; border-radius: 4px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row-btn { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--surf); border: 1px solid var(--line); border-radius: 4px; padding: 10px; text-align: left; color: inherit; min-height: 64px; }
.avatar { width: 36px; height: 36px; border-radius: 4px; background: var(--accent-dim); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .02em; border: 1px solid var(--line-2); padding: 2px 6px; color: var(--muted); border-radius: 4px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.box { background: var(--surf); border: 1px solid var(--line); padding: 10px; border-radius: 4px; }
.box b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.hist ul { margin: 0; padding: 0; }
.hist li { list-style: none; display: grid; grid-template-columns: 12px 1fr; gap: 8px; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
.dot { width: 8px; height: 8px; background: var(--accent); margin-top: 6px; }
.modal { position: absolute; inset: 0; background: var(--scrim); display: none; align-items: flex-end; justify-content: center; z-index: 20; padding: 12px; }
html[data-size="laptop"] .modal { align-items: center; }
.modal.open { display: flex; }
.sheet { width: 100%; max-width: 420px; background: var(--surf); border: 1px solid var(--line); border-radius: 6px; padding: 16px; max-height: 86%; overflow: auto; }
.sheet h2 { margin: 0 0 8px; font-size: 18px; }
.toast { position: absolute; left: 12px; right: 12px; bottom: 72px; z-index: 30; background: var(--surf-2); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; font-size: 14px; font-weight: 600; display: none; }
.toast.show { display: block; }
.auth { padding: 28px 20px; max-width: 400px; margin: 0 auto; }
.kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.auth h1 { font-size: 24px; margin: 8px 0; }
.steps { display: flex; gap: 4px; margin: 8px 0 16px; }
.steps i { flex: 1; height: 3px; background: var(--surf-3); }
.steps i.on { background: var(--accent); }
.qr { width: 168px; height: 168px; margin: 8px auto; background: #fff; color: #111; display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; padding: 8px; }
.qr b { background: #111; }
.secret { font-family: var(--font-mono); background: var(--bg-0); border: 1px dashed var(--line); padding: 10px; text-align: center; letter-spacing: .06em; font-size: 14px; }
.sync { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; background: var(--green); }
.sync.warn i { background: var(--yellow); }
.gallery { display: grid; gap: 12px; padding: 12px; }
.g-block { background: var(--surf); border: 1px solid var(--line); padding: 12px; }
.g-block h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.notes { background: #101214; color: #c5ccd0; padding: 16px; font-size: 14px; line-height: 1.45; border-top: 1px solid #262c31; }
.notes h2 { margin: 0 0 8px; font-size: 14px; color: #e3e6e8; }
.notes ol { margin: 0; padding-left: 18px; }
.notes li { margin: 6px 0; }
</style>
</head>
<body>
<div class="studio">
  <div class="studio-bar">
    <div class="brand">HORIZON / МАКЕТ</div>
    <div class="sp"></div>
    <div class="seg" role="group" aria-label="Розмір">
      <button type="button" class="js-size" data-v="phone" aria-pressed="true">390</button>
      <button type="button" class="js-size" data-v="laptop" aria-pressed="false">1366</button>
    </div>
    <div class="seg" role="group" aria-label="Тема">
      <button type="button" class="js-theme" data-v="dark" aria-pressed="true">Темна</button>
      <button type="button" class="js-theme" data-v="light" aria-pressed="false">Світла</button>
    </div>
    <div class="seg" role="group" aria-label="Мова">
      <button type="button" class="js-lang" data-v="ua" aria-pressed="true">UA</button>
      <button type="button" class="js-lang" data-v="en" aria-pressed="false">EN</button>
    </div>
    <div class="seg" role="group" aria-label="Роль">
      <button type="button" class="js-role" data-v="fighter" aria-pressed="true">Боєць</button>
      <button type="button" class="js-role" data-v="zone" aria-pressed="false">Адмін зони</button>
      <button type="button" class="js-role" data-v="full" aria-pressed="false">Повний</button>
    </div>
  </div>
  <nav class="studio-nav" id="studioNav"></nav>
  <div class="stage-wrap">
    <div class="stage"><div class="device" id="device"><div class="app" id="app"></div><div class="toast" id="toast"></div></div></div>
    <div class="notes" id="notes"></div>
  </div>
</div>

    <div class="g-block"><h3>Fields</h3><div class="stack"><input class="field" value="Сокіл"><div class="otp"><input value="1"><input value="1"><input value="4"><input><input><input></div></div></div>
    <div class="g-block"><h3>Status</h3><div class="row">${badge("crit")}${badge("low")}${badge("ok")}${badge("full")}
      <span class="cond cond-ok"><i></i>${t("condOk")}</span><span class="cond cond-rep"><i></i>${t("condRep")}</span><span class="cond cond-bad"><i></i>${t("condBad")}</span></div></div>
    <div class="g-block"><h3>Qty</h3>${stepper(state.items[0])}</div>
    <div class="g-block"><h3>Filters</h3><div class="chips"><button class="chip" aria-pressed="true">${t("crit")} <span class="n">4</span></button><button class="chip">${t("low")} <span class="n">6</span></button></div></div>
  </div>`);
}
const SCREENS={login:screenLogin,first:screenFirst,wait:screenWait,table:screenTable,item:screenItem,admin:screenAdmin,staff:screenStaff,person:screenPerson,positions:screenPositions,components:screenComponents};
function modalHtml(){
  const m=state.modal; if(!m) return "";
  if(m.type==="del") return `<div class="modal open"><div class="sheet"><h2>${t("del")}</h2><p class="hint">${t("delAsk")}</p>
    <div class="stack" style="margin-top:12px"><button class="btn btn-red" data-act="del-ok">${t("confirm")}</button><button class="btn btn-gray" data-act="modal-close">${t("cancel")}</button></div></div></div>`;
  if(m.type==="code") return `<div class="modal open"><div class="sheet"><h2>${t("codeOnce")}</h2><div class="secret">7K4P-2M9Q</div>
    <p class="hint" style="margin-top:8px">${t("addPerson")}: Клен</p><button class="btn btn-green btn-block" style="margin-top:12px" data-act="modal-close">${t("saved")}</button></div></div>`;
  if(m.type==="blast"||m.type==="edit-pos"||m.type==="add-pos"){
    const title=m.type==="blast"?t("blast"):m.type==="add-pos"?t("createPos"):t("editPos");
    return `<div class="modal open"><div class="sheet"><h2>${title}</h2>
      ${m.type==="blast"?`<textarea class="field" placeholder="${t("msgPh")}"></textarea>`:`<label class="label">${t("name")}</label><input class="field" value="${m.type==="edit-pos"?"ОП-Північ":""}"><label class="label">${t("type")}</label><input class="field" value="ОП"><label class="label">${t("staleIn")}</label><input class="field" value="24">`}
      <div class="stack" style="margin-top:12px"><button class="btn ${m.type==="blast"?"btn-blue":"btn-green"}" data-act="sent">${m.type==="blast"?t("send"):t("save")}</button>
      <button class="btn btn-gray" data-act="modal-close">${t("cancel")}</button></div></div></div>`;
  }
  if(m.type==="transfer") return `<div class="modal open"><div class="sheet"><h2>${t("transfer")}</h2>
    <p class="hint">ОП-Північ закриється, Склад-А відкриється однією дією.</p>
    <select class="field">${POSITIONS.map(p=>`<option>${p.name}</option>`).join("")}</select>
    <div class="stack" style="margin-top:12px"><button class="btn btn-green" data-act="modal-close">${t("confirm")}</button>
    <button class="btn btn-gray" data-act="modal-close">${t("cancel")}</button></div></div></div>`;
  return "";
}
function render(){
  document.documentElement.lang = state.lang==="ua"?"uk":"en";
  document.documentElement.setAttribute("data-theme", state.theme);
  document.documentElement.setAttribute("data-size", state.size);
  document.getElementById("studioNav").innerHTML = [
    ["login","1. "+t("loginTitle")],["first","2. "+t("firstTitle")],["wait","3. "+t("waitTitle")],
    ["table","4. "+t("pos")],["item","5. "+t("qty")],["admin","6. "+t("admin")],
    ["staff","7. "+t("staff")],["person","7b. "+t("callsign")],["positions","8. "+t("positions")],["components","UI"]
  ].map(([id,l])=>`<button type="button" data-go="${id}" ${state.screen===id?"aria-current=page":""}>${l}</button>`).join("");
  document.getElementById("app").innerHTML = (SCREENS[state.screen]||screenLogin)() + modalHtml();
  document.getElementById("notes").innerHTML = `<h2>Рішення поля</h2><ol>
    <li>Статус без кольору: підпис + форма (трикутник / ромб / коло / риска) + рейка зліва.</li>
    <li>Правка залишку: −, поле, +, «Зберегти». Два торкання. Зона 44×44.</li>
    <li>Критичні рядки завжди зверху і не ховаються пошуком чи фільтром.</li>
    <li>390 — картки, 1366 — таблиця з липкою шапкою.</li>
    <li>Радіус 4px, без таблеток і світіння.</li>
    <li>Синя — створити/перейти, зелена — зберегти, червона — видалити, сіра — скасувати.</li>
    <li>Темна #0f1214 / #15191c / акцент #3b6e8f. Світла — чорний текст на папері.</li>
    <li>Системний шрифт і вбудований SVG, без зовнішніх джерел.</li>
    <li>Довгі українські підписи переносяться, кнопка не нижче 44px.</li>
    <li>Офлайн у шапці: «Черга: 2 зміни».</li>
  </ol><p class="hint" style="margin:10px 0 0">Допущення: протухання 24 год на позицію; ціль у рядку = ідеал; адмін зони бачить 5 позицій зони «Північ»; бот зовнішній.</p>`;
}
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1600); }
function draft(id,next){ state.drafts[id]=Math.max(0,next); render(); }
function commit(id){ const it=state.items.find(x=>x.id===id); if(!it) return; const v=state.drafts[id]; if(v==null||v===it.q) return; it.q=v; it.by="Сокіл"; it.at="зараз"; it.pending=true; delete state.drafts[id]; render(); toast(t("save")+" · "+it.q+" "+it.unit); }
document.body.addEventListener("click", e=>{
  const sizeBtn=e.target.closest(".js-size"); if(sizeBtn){ state.size=sizeBtn.dataset.v; document.querySelectorAll(".js-size").forEach(b=>b.setAttribute("aria-pressed", String(b===sizeBtn))); render(); return; }
  const themeBtn=e.target.closest(".js-theme"); if(themeBtn){ state.theme=themeBtn.dataset.v; document.querySelectorAll(".js-theme").forEach(b=>b.setAttribute("aria-pressed", String(b===themeBtn))); render(); return; }
  const langBtn=e.target.closest(".js-lang"); if(langBtn){ state.lang=langBtn.dataset.v; document.querySelectorAll(".js-lang").forEach(b=>b.setAttribute("aria-pressed", String(b===langBtn))); render(); return; }
  const roleBtn=e.target.closest(".js-role");
  if(roleBtn){ state.role=roleBtn.dataset.v; document.querySelectorAll(".js-role").forEach(b=>b.setAttribute("aria-pressed", String(b===roleBtn))); if(state.role==="fighter" && ["admin","staff","person","positions"].includes(state.screen)) state.screen="table"; render(); return; }
  const go=e.target.closest("[data-go]"); if(go){ state.screen=go.getAttribute("data-go"); if(state.screen==="item"&&!state.selectedItem) state.selectedItem=state.items[0].id; render(); return; }
  const openItem=e.target.closest("[data-open-item]"); if(openItem && !e.target.closest(".qty")){ state.selectedItem=openItem.getAttribute("data-open-item"); state.screen="item"; render(); return; }
  const openP=e.target.closest("[data-open-person]"); if(openP){ state.selectedPerson=openP.getAttribute("data-open-person"); state.screen="person"; render(); return; }
  const filter=e.target.closest("[data-filter]"); if(filter){ state.filter=filter.getAttribute("data-filter"); render(); return; }
  const act=e.target.closest("[data-act]"); if(!act) return;
  const a=act.getAttribute("data-act"); const wrap=act.closest("[data-id]"); const id=wrap && wrap.getAttribute("data-id");
  if(a==="inc"||a==="dec"){ const it=state.items.find(x=>x.id===id); draft(id, qtyVal(it)+(a==="inc"?1:-1)); return; }
  if(a==="save"){ commit(id); return; }
  if(a==="wiz-next"){ if(state.wizard>=3){state.screen="wait"; state.wizard=0;} else state.wizard++; render(); return; }
  if(a==="wiz-back"){ state.wizard=Math.max(0,state.wizard-1); render(); return; }
  if(a==="go-login"){ state.screen="login"; render(); return; }
  if(a==="del-ask"){ state.modal={type:"del"}; render(); return; }
  if(a==="del-ok"){ state.items=state.items.filter(x=>x.id!==state.selectedItem); state.modal=null; state.screen="table"; toast(t("del")); render(); return; }
  if(a==="modal-close"){ state.modal=null; render(); return; }
  if(a==="add"){ toast(t("addRow")); return; }
  if(a==="add-person"||a==="new-code"){ state.modal={type:"code"}; render(); return; }
  if(a==="wait-only"){ state.waitOnly=!state.waitOnly; render(); return; }
  if(a==="blast"){ state.modal={type:"blast"}; render(); return; }
  if(a==="edit-pos"){ state.modal={type:"edit-pos"}; render(); return; }
  if(a==="add-pos"){ state.modal={type:"add-pos"}; render(); return; }
  if(a==="sent"){ state.modal=null; toast(t("save")); render(); return; }
  if(a==="transfer"||a==="assign"){ state.modal={type:"transfer"}; render(); return; }
  if(a==="kill"||a==="disable"||a==="unassign"){ toast(t("confirm")); return; }
});
document.body.addEventListener("input", e=>{
  if(e.target.id==="search"){ const pos=e.target.selectionStart; state.q=e.target.value; render(); const n=document.getElementById("search"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
  if(e.target.id==="catSel"){ state.cat=e.target.value; render(); }
  if(e.target.getAttribute("data-act")==="qty"){ const id=e.target.closest("[data-id]").getAttribute("data-id"); const v=parseInt(e.target.value,10); if(!Number.isNaN(v)) state.drafts[id]=Math.max(0,v); }
});
render();
</script>
</body>
</html>

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 64k;

  # add_header внутри location отменяет серверные — поэтому include в каждом.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Приложение больше не ставится как PWA. У тех, кто успел установить, браузер
  # при заходе проверяет старый /sw.js: 404 на нём снимает регистрацию. Если
  # отдать вместо него index.html, старый worker останется и будет держать
  # прежнюю версию из своего кэша.
  location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # index и скрипты запуска не кэшируем, иначе обновление залипает у тех, кто уже открывал.
  location ~ ^/(theme\.js|unregister-sw\.js|index\.html)$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
